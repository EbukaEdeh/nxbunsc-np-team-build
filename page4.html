<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storm NP — Page 4</title>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="4">
<div class="vignette"></div>

<header class="topbar">
  <div class="brand"><b>Naruto × Boruto</b> <span>Ultimate Ninja Storm Connections</span> · <em>NP Team Build</em></div>
  <div class="player">Player 1</div>
</header>

<main class="screen">
  <section class="left">
    <div class="teambar">
      <div class="slots" id="slots"></div>
      <div class="total">
        <div class="tlabel">Total NP</div>
        <div class="tval"><b id="cur">0</b><span>/12</span></div>
      </div>
      <button class="reset" id="reset" type="button">Reset</button>
    </div>

    <div class="sortbar" id="sortbar"></div>

    <div class="grid" id="grid"></div>

    <nav class="pagenav" id="pagenav"></nav>
  </section>

  <aside class="right" id="detail"></aside>
</main>

<div class="toast" id="toast"></div>

<script src="roster.js"></script>
<script src="icons.js"></script>
<script src="app.js"></script>
</body>
</html>
